[workspace]
members = ["editor", "launcher"]

[package]
name = "soomfon-deck"
version = "0.2.0"
edition = "2024"

[dependencies]
ab_glyph = "0.2"
async-hid = { version = "0.5.3", default-features = false, features = ["tokio", "win32"] }
base64 = "0.22"
futures-lite = "2"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
log = "0.4"
mirajazz = "0.16"
notify = "8"
obws = { version = "0.15", features = ["events"] }
resvg = { version = "0.49", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros", "time", "signal", "sync"] }
tokio-websockets = { version = "0.13", default-features = false, features = ["client", "fastrand", "sha1_smol"] }
toml = "1"

# Pilotage direct du lecteur de musique (Spotify…) via les contrôles multimédias de Windows.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Media_Control", "Foundation_Collections", "Win32_System_Threading", "Win32_Foundation", "Win32_Security", "Win32_System_SystemInformation", "Win32_Media_Audio", "Win32_Media_Multimedia", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# Binaire le plus petit / rapide possible : c'est le démon qui tournera en permanence.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# "unwind" : un plantage dans une tâche (bibliothèque tierce…) est consigné au lieu de tout fermer.
panic = "unwind"
strip = true
