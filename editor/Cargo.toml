[package]
name = "soomfon-editor"
version = "0.3.0"
edition = "2024"
description = "Éditeur graphique de la configuration soomfon-deck"

[dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
obws = "0.15"
rfd = { version = "0.18", default-features = false }
serde_json = "1"
slint = "1.18"
soomfon-deck = { path = ".." }
tokio = { version = "1", features = ["rt"] }

[build-dependencies]
slint-build = "1.18"
