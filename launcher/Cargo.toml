[package]
name = "blackat-launcher"
version = "0.2.0"
edition = "2024"
description = "Lanceur Blackat : démarre OBS, Streamer.bot et le Stream Deck en un clic"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
slint = "1.18"
zip = { version = "9.5.1", default-features = false, features = ["aes-crypto", "deflate"] }

[build-dependencies]
slint-build = "1.18"
